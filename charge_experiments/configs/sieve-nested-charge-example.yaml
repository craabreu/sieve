run:
  experiment: dash-charges-nested
  seed: 0
data:
  store: dash-molecules
  split_column: split
predictor:
  name: sieve
  params:
    max_wl_depth: 3
    minimum_support: 1
# std_weighted is left out deliberately: sieve's own per-atom std (sqrt of
# its class variance) hasn't been checked against real data yet -- see
# predictors/sieve_predictor.py's own module docstring.
children:
  - equal_weighted
