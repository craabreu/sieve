# Pinned external repos for the baseline experiments (see predictors/dash.py).
# `make -C experiments external` clones each at its pinned commit into
# experiments/external/<name>/ (git-ignored).

[dash_tree]
url = "https://github.com/rinikerlab/DASH-tree.git"
commit = "6cf1b2351c4674e602153dd493c06d9c020fc9ce"  # main, 2026-08-24
license = "MIT"
notes = """
Pip-installable (its own pyproject.toml, package name `serenityff`), but
predictors/dash.py uses a sys.path shim instead of `pip install .`: the
default MBIS-charge tree topology ships as ~300MB of .gz/.h5 files under
serenityff/charge/data/default_dash_tree/, and a built wheel is not
confirmed to carry them (no MANIFEST.in / package_data seen in its
pyproject.toml). A plain git checkout guarantees the data travels with the
code; a wheel install might not.

Runtime deps for atom-matching only (confirmed by reading dash_tree.py's
imports and tree_only_env.yml): numpy, pandas, rdkit, tables (pytables),
tqdm, Pillow. No torch/pytorch-geometric needed -- those are only pulled in
by DASH's own GNN-training path (tree_develop/), which Stage A does not use.
These are declared in pyproject.toml's `experiments` extra.

GOTCHA: a git clone of DASH-tree left inside this project's directory tree
gets silently absorbed by uv as an implicit workspace member (it has its
own pyproject.toml) -- uv then tries to build and install "serenityff"
into this project's venv/lockfile on every `uv sync`/`uv lock`/`uv run`.
Fixed via `[tool.uv.workspace] exclude = ["experiments/external/*"]` in
the root pyproject.toml. If that exclusion is ever removed, this problem
comes back immediately.

GOTCHA 1: at this pinned commit, `DASHTree(preload=False)` (the
on-demand-load mode, needs no network access) raises `KeyError` on every
hydrogen atom: `_get_init_layer`'s H special-case needs
`self.tree_storage[branch_idx]` for the H-connected heavy atom's own
branch before `match_new_atom`'s own lazy-load runs. Since chaos-store
SMILES carry explicit hydrogens (cosmolayer_adapter's `removeHs=False`
convention), this would fall back every H atom to the global mean. Fixed
by defaulting `DASHPredictor(preload=True)` (~10s, ~300MB into memory
once, still no network -- the data ships in the clone).

GOTCHA 2 (not fixable on our side): even with preload=True, ~5% of
chaos-store atoms cannot be matched -- but the cause is NOT gotcha 1.
`init_neighbor_dict` raises `KeyError` on any atom whose feature tuple is
outside DASH's published vocabulary (e.g. `(5, 3, 0, False, 3)` =
3-connected boron; Si, Ge, Sb and Te also appear in chaos-store). It runs
over the WHOLE molecule, so one such atom takes every atom in that
molecule down with it -- which is why ordinary H and C dominate the raw
failure counts. predictors/dash.py counts these (per split, into the run
manifest's `match_stats` and a WARNING) so a run always records how much
of a split fell back to the global mean rather than being genuinely
matched -- this is a baseline-fairness matter, not just tidiness.

GOTCHA 3 (perf): `match_new_atom` rebuilds the entire molecule's neighbor
dict on every call unless one is passed via its `neighbor_dict=` kwarg --
i.e. O(n_atoms^2) work per molecule. DASH's own `_get_allAtoms_nodePaths`
hoists it per molecule; predictors/dash.py's `_atom_paths` does the same
(8.5x faster on chaos-store, bit-identical metrics). Re-check with a
`--limit` timing probe before committing to a full-store run.

PAPER PARAMETERS (checked against the original preprint, Lehner et al.,
J. Chem. Inf. Model. 63, 6014-6028 (2023) / arXiv:2305.15981, read
directly as a PDF rather than trusted from a summarized web fetch):
- `max_depth: 16` matches the paper's own tuned optimum (Sec 3.3 / Fig 9D).
- `attention_threshold`: the paper's tuned optimum is ~5.2 (Fig 10's RMSE-
  vs-threshold sweep; Fig 8's caption gives the more precise "5.23"). The
  paper's own running prose states "0.95" once (Sec 3.3) but that's
  contradicted by both figures and is being treated as a typo/draft leftover
  -- a sub-1 threshold can't be the real stopping criterion, since Fig 11
  shows the *cumulative* attention it's compared against routinely exceeds 1
  as the subgraph grows. Our config previously used `10`, which is just
  `DASHTree.match_new_atom`'s own hardcoded function default, not the
  paper's tuned value -- updated to `5.2` in dash-*.yaml and
  `DASHPredictor`'s own default.
- `minimum_support`: no equivalent was used to build the published/shipped
  tree. Sec 2.4.2 says so explicitly ("the attention could be used as an
  early stopping condition ... not done here"). The only count-based pruning
  anywhere in the DASH-tree codebase is `Node.prune()` in
  `serenityff/charge/tree/node.py` (drops a child with `count < 3` past
  level 3) -- but it is dead code: grepping the whole repo for `.prune(`
  finds only its own recursive self-call, never invoked from
  `Tree_constructor.build_tree()` or either worker module that actually
  builds the shipped tree, and it also mutates `self.children` while
  iterating it (a real bug, consistent with it being an abandoned
  experiment). Sieve initially added its own `minimum_support`-gated
  threshold on top of the published topology anyway, as a safety margin
  against thinly-supported nodes; measured (below) to underperform DASH's
  own missing-value-only fallback with no threshold at all, on every
  metric, at both granularities -- removed. `DASHPredictor` now follows
  DASH's own code exactly: no support concept whatsoever.

STAGE A PRECEDENT (checked against the DASH-tree authors' own
follow-up, Lehner et al., "DASH properties: Estimating atomic and molecular
properties from a dynamic attention-based substructure hierarchy," J. Chem.
Phys. 161, 074103 (2024)): the authors themselves reuse the published tree
topology (built once from MBIS-charge attention values) to predict several
other target properties (AM1-BCC, Mulliken, RESP charges; dispersion C6;
polarizability; the dual descriptor; molecular dipole/polarizability) by
walking the same fixed topology and dropping each new property's median/
variance into the existing nodes -- their own words: "this population
process does not include any fitting... reusing the DASH tree structure
built for the MBIS partial charges." No GNN retraining, no rebuilt topology.
This is exactly our own Stage A move (fixed published topology, our own
per-node target-property statistics on top), just for a different target
(sigma-profile shape/location/magnitude instead of a scalar property) --
independent precedent that this is a legitimate reuse, not a shortcut, and
context for whoever eventually scopes Stage B (rebuilding the topology
itself, still out of scope for this milestone -- see design.md).

DASH BACK-OFF DESIGN: reproduces DASH literally, relying on their own code
as much as possible -- not a parallel reimplementation of DASH's back-off
semantics, however faithful. This is
DASHPredictor's whole design, and the only one this project ships now (two
Sieve-invented alternatives were tried, measured, and retired along the
way). Full design story, the two real bugs found building the fast
reimplementation of `get_property_noNAN`'s walk, and full-store results
(DASH beats both retired variants on every metric) -- see
`experiments/docs/dash.md`.
"""

[cosmonet_investigation]
url = "https://github.com/snaserib/COSMO-NET-Paper.git"
commit = "366839a0e6f94db65e54dc64068f6266a3f0d914"  # main, 2026-08-25
license = "MIT"
notes = """
Historical investigation record -- the clone this section describes was
deleted from disk (21GB, git-ignored) once the findings were fully
captured in prose. This is the reasoning behind
predictors/chemprop_cosmonet.py's whole reason to exist: the checkpoint
this repo ships doesn't match its own training log (MODEL_HPARAMS's keys
mostly aren't real DMPNNModel.__init__ parameter names, so they never
reach the encoder), and a first predictor built directly on this repo's
own saved-CSV lookup (CosmonetPredictor, now retired) inherited that
untrustworthiness. Full derivation -- the checkpoint-weight evidence
((300,147) vs (300,49), the GraphConvConstants.ATOM_FDIM patch mechanism,
GitHub issue #1 corroboration) and the retired predictor's own numbers --
in `experiments/docs/cosmonet_investigation.md`.
"""

[chaos_store_ua]
notes = """
Prompted by a question about DASH's own atom granularity: is it
all-atom or united-atom (implicit H)? DASH predicts a value for every
hydrogen but represents one purely as an attribute of its heavy-atom
neighbor -- so a real united-atom store (chaos-store-ua, built via
`coarse-grain-store`) was needed to test DASH (and chemprop_atom) at
that native granularity fairly. Building it hit a real O(n^2)
performance bug in cosmolayer's own coarse_grain() (fixed upstream,
cosmolayer#55, 40-90 min -> 21.7s). The headline finding: DASH is
AA-only for every comparison in this milestone -- its own feature tuple
uses atom.GetDegree() (RDKit's explicit-neighbor-only count), and its
published tree was built entirely from all-atom data where degree
structurally includes bonded H, so a united-atom store presents tuples
its published vocabulary was never built to see. chemprop_atom has no
analogous defect and genuinely improves on the UA store. Full
derivation, the DASH-UA and chemprop_atom-UA full-store results, and
the primary-source confirmation (Lehner et al. 2023) -- in
experiments/docs/chaos_store_ua.md.
"""

[chemprop_cosmonet]
# A PyPI version pin, not a git SHA -- chemprop is a real pip dependency
# (pyproject.toml's `chemprop` extra), unlike DASH-tree/COSMO-NET-Paper's
# sys.path/subprocess clones. Installed via `uv sync --extra chemprop`.
version = "2.3.1"  # requires-python >=3.11,<3.15
license = "MIT"
notes = """
T10 (chemprop_cosmonet): a Chemprop D-MPNN reimplementation of
COSMO-NET's sigma-profile model, reproducing the *real*
checkpoint-verified architecture (hidden_size=300, 3 FFN layers,
dropout=0, mean pooling -- not the paper's claimed 51/1/0.1/sum) rather
than trusting the paper's text or the training script's own printed
hyperparameters -- both wrong, independently of each other; see
[cosmonet_investigation] above for why. Full architecture-revision
story and the loss_mode experiment (w1_normalized reached the best
profile shape of any config in this milestone) -- in
experiments/docs/chemprop_cosmonet.md.

T11 (chemprop_atom): predictors/chemprop_atom.py, a per-atom sigma-
profile predictor sharing this same chemprop pin. Headline finding:
T10's softplus output structurally collapses at the atom level (atom
profiles are 81.4% exact zeros, driving pre-activations to -inf where
softplus's own gradient vanishes) -- fixed with a squared (x**2) output
activation, equally non-negative but reachable at a finite point. Full
gotcha writeup, atom-vs-molecule full-store comparison, and united-atom
results -- in experiments/docs/chemprop_atom.md.
"""
