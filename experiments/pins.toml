# Pinned external repos for the baseline experiments (see predictors/dash.py).
# `make -C experiments external` clones each at its pinned commit into
# experiments/external/<name>/ (git-ignored).

[dash_tree]
url = "https://github.com/rinikerlab/DASH-tree.git"
commit = "6cf1b2351c4674e602153dd493c06d9c020fc9ce"  # main, 2026-08-24
license = "MIT"
notes = """
Pip-installable (its own pyproject.toml, package name `serenityff`), but
predictors/dash.py uses a sys.path shim instead of `pip install .`: the
default MBIS-charge tree topology ships as ~300MB of .gz/.h5 files under
serenityff/charge/data/default_dash_tree/, and a built wheel is not
confirmed to carry them (no MANIFEST.in / package_data seen in its
pyproject.toml). A plain git checkout guarantees the data travels with the
code; a wheel install might not.

Runtime deps for atom-matching only (confirmed by reading dash_tree.py's
imports and tree_only_env.yml): numpy, pandas, rdkit, tables (pytables),
tqdm, Pillow. No torch/pytorch-geometric needed -- those are only pulled in
by DASH's own GNN-training path (tree_develop/), which Stage A does not use.
These are declared in pyproject.toml's `experiments` extra.

GOTCHA (hit and fixed 2026-08-24): a git clone of DASH-tree left inside this
project's directory tree gets silently absorbed by uv as an implicit
workspace member (it has its own pyproject.toml) -- uv then tries to build
and install "serenityff" into this project's venv/lockfile on every `uv
sync`/`uv lock`/`uv run`. Fixed via `[tool.uv.workspace] exclude =
["experiments/external/*"]` in the root pyproject.toml. If that exclusion
is ever removed, this problem comes back immediately.

GOTCHA 1 (hit and fixed 2026-08-24): at this pinned commit,
`DASHTree(preload=False)` (the on-demand-load mode originally planned, since
it needs no network access) raises `KeyError` on every hydrogen atom:
`_get_init_layer`'s H special-case needs `self.tree_storage[branch_idx]` for
the H-connected heavy atom's own branch before `match_new_atom`'s own
lazy-load runs. Since chaos-store SMILES carry explicit hydrogens
(cosmolayer_adapter's `removeHs=False` convention), this would fall back
every H atom to the global mean. Fixed by defaulting
`DASHPredictor(preload=True)` (~10s, ~300MB into memory once, still
no network -- the data ships in the clone).

GOTCHA 2 (measured 2026-08-24, NOT fixable on our side): even with
preload=True, ~5% of chaos-store atoms cannot be matched -- but the cause is
NOT gotcha 1. `init_neighbor_dict` raises `KeyError` on any atom whose
feature tuple is outside DASH's published vocabulary (e.g. `(5, 3, 0, False,
3)` = 3-connected boron; Si, Ge, Sb and Te also appear in chaos-store). It
runs over the WHOLE molecule, so one such atom takes every atom in that
molecule down with it -- which is why ordinary H and C dominate the raw
failure counts. Measured on the first 300 chaos-store molecules: 554/11000
atoms, from 13/300 molecules rejected outright. predictors/dash.py counts
these (per split, into the run manifest's `match_stats` and a WARNING) so a
run always records how much of a split fell back to the global mean rather
than being genuinely matched -- this is a baseline-fairness matter, not just
tidiness.

GOTCHA 3 (perf, fixed 2026-08-24): `match_new_atom` rebuilds the entire
molecule's neighbor dict on every call unless one is passed via its
`neighbor_dict=` kwarg -- i.e. O(n_atoms^2) work per molecule. DASH's own
`_get_allAtoms_nodePaths` hoists it per molecule; predictors/dash.py's
`_atom_paths` now does the same, measured 8.5x faster on chaos-store with
bit-identical metrics. This is design.md risk #1's main lever; re-check it
with a `--limit` timing probe before committing to a full-store run.

PAPER PARAMETERS (checked 2026-08-24 against the original preprint, Lehner
et al., J. Chem. Inf. Model. 63, 6014-6028 (2023) / arXiv:2305.15981, read
directly as a PDF rather than trusted from a summarized web fetch):
- `max_depth: 16` matches the paper's own tuned optimum (Sec 3.3 / Fig 9D).
- `attention_threshold`: the paper's tuned optimum is ~5.2 (Fig 10's RMSE-
  vs-threshold sweep; Fig 8's caption gives the more precise "5.23"). The
  paper's own running prose states "0.95" once (Sec 3.3) but that's
  contradicted by both figures and is being treated as a typo/draft leftover
  -- a sub-1 threshold can't be the real stopping criterion, since Fig 11
  shows the *cumulative* attention it's compared against routinely exceeds 1
  as the subgraph grows. Our config previously used `10`, which is just
  `DASHTree.match_new_atom`'s own hardcoded function default, not the
  paper's tuned value -- updated to `5.2` in dash-*.yaml and
  `DASHPredictor`'s own default, 2026-08-24.
- `minimum_support`: no equivalent was used to build the published/shipped
  tree. Sec 2.4.2 says so explicitly ("the attention could be used as an
  early stopping condition ... not done here"). The only count-based pruning
  anywhere in the DASH-tree codebase is `Node.prune()` in
  `serenityff/charge/tree/node.py` (drops a child with `count < 3` past
  level 3) -- but it is dead code: grepping the whole repo for `.prune(`
  finds only its own recursive self-call, never invoked from
  `Tree_constructor.build_tree()` or either worker module that actually
  builds the shipped tree, and it also mutates `self.children` while
  iterating it (a real bug, consistent with it being an abandoned
  experiment). Sieve initially added its own `minimum_support`-gated
  threshold on top of the published topology anyway, as a safety margin
  against thinly-supported nodes; measured (below) to underperform DASH's
  own missing-value-only fallback with no threshold at all, on every
  metric, at both granularities -- removed. `DASHPredictor` now follows
  DASH's own code exactly: no support concept whatsoever.

STAGE A PRECEDENT (checked 2026-08-24 against the DASH-tree authors' own
follow-up, Lehner et al., "DASH properties: Estimating atomic and molecular
properties from a dynamic attention-based substructure hierarchy," J. Chem.
Phys. 161, 074103 (2024)): the authors themselves reuse the published tree
topology (built once from MBIS-charge attention values) to predict several
other target properties (AM1-BCC, Mulliken, RESP charges; dispersion C6;
polarizability; the dual descriptor; molecular dipole/polarizability) by
walking the same fixed topology and dropping each new property's median/
variance into the existing nodes -- their own words: "this population
process does not include any fitting... reusing the DASH tree structure
built for the MBIS partial charges." No GNN retraining, no rebuilt topology.
This is exactly our own Stage A move (fixed published topology, our own
per-node target-property statistics on top), just for a different target
(sigma-profile shape/location/magnitude instead of a scalar property) --
independent precedent that this is a legitimate reuse, not a shortcut, and
context for whoever eventually scopes Stage B (rebuilding the topology
itself, still out of scope for this milestone -- see design.md).

DASH BACK-OFF DESIGN (2026-08-26): the user asked for a predictor that
reproduces DASH literally, relying on their own code as much as possible --
not a parallel reimplementation of DASH's back-off semantics, however
faithful. This is DASHPredictor's whole design, and the only one this
project ships now (see the FULL-STORE RESULTS table below for the two
Sieve-invented alternatives tried and measured along the way, since retired).
Investigated piece by piece against the pinned DASH-tree clone:

- Shape/location/area decomposition is NOT an algorithmic deviation from
  DASH (corrected framing from earlier in this conversation) -- it's a
  choice of which property gets fed into the same populate-and-average
  machinery, no different in kind from DASH-properties choosing to
  populate nodes with Mulliken vs. RESP charge. Irrelevant to what makes
  something "literal".
- No DASH function populates an EXISTING tree with a new property.
  DASH-properties itself gets new properties onto nodes by re-matching
  atoms and averaging (its own paper, Sec II.C: "this population process
  does not include any fitting... each node's property is simply the
  median of all properties of all atoms matching this node") -- the same
  shape populate_tree_with_sigma_properties takes. Some accumulation code
  is unavoidably ours; nothing exists to call instead.
- PAPER SAYS MEDIAN, CODE COMPUTES MEAN: grepped the whole DASH-tree repo
  for `median` -- zero matches anywhere in `serenityff/`. The actual
  population code (`DevelopNode.update_average`/`get_DASH_data_from_
  dev_node`, tree_develop/develop_node.py) computes `np.nanmean`/
  `np.nanstd`. A real paper/code discrepancy, not a translation nuance.
  "Rely on their code" means mean, not median -- this predictor computes
  the mean, matching what DASH's own code actually does.
- `DASHTree.get_property_noNAN` IS DASH's own real prediction-time
  fallback: walks a matched node path deepest -> shallowest, returns the
  first non-NaN value, consults no count/support threshold anywhere.
  `Node.prune()` (node.py) -- the one piece of code that WOULD implement a
  count threshold -- is dead code, confirmed via grep: no caller anywhere
  in the repo except its own commented-out recursive self-call.

FIRST DESIGN, BUILT AND MEASURED, THEN REPLACED: an initial version called
`get_property_noNAN` literally, once per scalar property (51 profile bins
+ charge_std, 52 calls/atom), so the back-off step was unambiguously
DASH's own code executing. Measured directly: ~47 microseconds/call
(pandas `.iloc` overhead, not compute); a `--limit 5000` probe's predict
step alone took 195s, extrapolating to ~39 minutes for the full store's
203,063 test atoms. The user weighed that cost against strict literalness
and chose speed -- "It doesn't matter if it's mathematically equivalent.
I want a simple function." -- so the final design (below) is a verified
byte-for-byte-equivalent reimplementation of `get_property_noNAN`'s own
walk, not a live call into it.

TWO REAL BUGS FOUND ALONG THE WAY, both only surfaced by actually running
the code end to end (never by the fast-suite unit tests alone, which never
touch a real `DASHTree`):
1. `get_property_noNAN` expects DASH's own RAW path format (`[branch_idx,
   0, node_id_1, node_id_2, ...]`, a flat list -- the literal
   `match_new_atom` return value), not this module's own `NodePath`
   conversion of it (`[(branch_idx, 0), (branch_idx, node_id_1), ...]`, a
   list of pairs, used everywhere else in dash.py as a dict key). Calling
   `get_property_noNAN(matched_node_path=path)` with OUR format raised
   `KeyError: (34, 0)` (`path[0]` is a tuple, not a plain branch-index
   int), then a second failure inside DASH's own except handler
   (`invalid literal for int() with base 10: '(34, 0)'`) trying to
   lazy-load a tree file named after the tuple's string repr. This finding
   is now moot for our own code (we no longer call `get_property_noNAN`),
   but stays true and worth knowing about their API.
2. A genuine full-store-only failure: a branch with ZERO training atoms
   never gets `populate_tree_with_sigma_properties`'s new columns written
   at all (it only ever touches branches its own accumulation actually
   visited). A `--limit 5000` probe never happened to route a test atom
   into such a branch; the full 53,079-molecule store did, and hit
   `KeyError: "None of [Index(['sigma_bin_0', ...])] are in the
   [columns]"`. Fixed by treating a branch with no new columns exactly
   like any other "nothing here" case -- immediate fallback, not a crash.
   Locked in with a regression test
   (`test_predict_via_data_storage_walk_falls_back_for_a_branch_with_no_
   new_columns`).

FINAL DESIGN: ``populate_tree_with_sigma_properties`` still writes the
plain (raw, undecomposed) mean profile + charge_std per node directly onto
`tree.data_storage[branch_idx]` (unchanged from the first version -- see
its own docstring). ``predict_via_data_storage_walk`` reimplements
`get_property_noNAN`'s exact semantics (deepest -> shallowest, first
populated node wins, else the global-mean fallback) rather than calling it
52 times per atom. A first attempt at this (`df[cols].iloc[node_id]`
inside the per-atom walk) was measured WORSE than the literal-call version
-- 467 microseconds/call, since re-selecting 52 columns from a wide
DataFrame on every single lookup dominates. Fixed by converting each
touched branch's relevant columns to a plain numpy array ONCE
(`df[cols].to_numpy()`), outside the atom loop, then indexing that array
per atom -- 0.35 microseconds/call, ~1300x faster than the naive
DataFrame-slicing version and ~130x faster than `get_property_noNAN`
itself. Verified equivalent to the literal-call version's own output,
bit-for-bit, on a real `--limit 5000` run before and after the swap (same
`area/mae` to 15 significant figures), not just argued.
- `charge_std_floor=0.1` matches `DASHTree.get_molecules_partial_charges`'s
  own `default_std_value` -- not the `1e-12` every other predictor here
  uses. Added as a new `reconcile_charge`/`roll_up`/`AtomPredictor`
  parameter (predictors/base.py), additive and defaulting to `1e-12` for
  every existing predictor's unchanged behavior.
- `charge_reconciliation="std_weighted"`'s formula was already verified
  algebraically identical to `get_molecules_partial_charges`'s own
  redistribution (residual weighted by each atom's std over the
  molecule's total std) earlier in this conversation -- kept as our own
  function rather than calling theirs directly, since
  `get_molecules_partial_charges` bundles matching + scalar-charge lookup
  + reconciliation into one molecule-level convenience function with no
  separable reconciliation-only piece, and only knows about a single
  charge property -- it doesn't fit this harness's composable atom-then-
  rollup architecture (profile + area + charge together). Documented as
  such rather than silently reused without comment.
- `attention_threshold=5.2` (the paper's own tuned optimum), not DASH's own
  code default (10) -- decided explicitly for this predictor, since it
  genuinely forks on this one parameter and the user chose the paper's
  tuned value over the shipped library default.

FULL-STORE RESULTS (2026-08-26, biased_split, n_test 5333 molecules /
203,063 atoms, fit 93.5s, predict 16.2s, **0/271,983 rolled-up bins
negative**, predicted areas 88.5-553.2 vs true 114.5-519.8). For the
record, the first two columns are the two Sieve-invented back-off variants
tried along the way -- shape/location/area decomposition
(`fit_backoff`/`predict_backoff`), and a plain bin-wise mean with a
`minimum_support=5` safety threshold on top of the published topology
(`fit_backoff_raw`/`predict_backoff_raw`) -- both since retired, their
code and configs (`dash-biased.yaml`'s and `dash-raw-biased.yaml`'s old
`dash_backoff` content) deleted; the third is what `DASHPredictor` ships:

| metric | DASH decomposed (retired) | DASH raw, min_support=5 (retired) | **DASH (shipped)** |
|---|---|---|---|
| atom/profile/w1_norm_mean | 1.030 | 1.058 | 1.012 |
| atom/area/r2 | 0.945 | 0.945 | 0.944 |
| atom/charge/mae | 0.00752 | 0.00752 | 0.00757 |
| profile/w1_norm_mean | 0.449 | 0.442 | **0.407** |
| area/r2 | 0.949 | 0.949 | 0.952 |
| charge/mae | 0.102 | 0.102 | 0.0922 |

DASH's own real back-off (no support threshold, just the missing-value
fallback) lands BETTER than both of Sieve's own retired variants on every
single metric shown, at both granularities -- not just close. The only
structural difference from "raw, min_support=5" is the support threshold
itself: same property (raw, undecomposed profile), same
attention_threshold, same tree. So Sieve's own `minimum_support=5` safety
threshold, motivated by distrust of thinly-supported nodes, was measurably
COSTING accuracy, not buying it -- a genuinely useful, unexpected finding:
the thing added to make DASH "more careful" made it worse, on this task, at
this scale. This is the finding that settled removing `minimum_support`
(and the decomposed/raw split) entirely rather than keeping either as an
option. Not investigated further (why a thinly-supported node's raw mean
would be MORE informative than backing off to a coarser, better-supported
ancestor is not obvious) -- worth a note for whoever revisits Stage A.
"""

[cosmonet_investigation]
url = "https://github.com/snaserib/COSMO-NET-Paper.git"
commit = "366839a0e6f94db65e54dc64068f6266a3f0d914"  # main, 2026-08-25
license = "MIT"
notes = """
Historical investigation record. The clone this section describes was
deleted from disk (21GB, git-ignored) once the findings below were fully
captured in prose -- nothing operational here (training invocations, CSV
paths, checkpoint directories) is reproducible on demand any more. What
remains load-bearing is the architectural evidence: this is the reasoning
behind predictors/chemprop_cosmonet.py's whole reason to exist, reproducing
the *real* checkpoint-verified architecture rather than trusting either the
paper's text or the training script's own printed hyperparameters.

A real training run was carried out on our own chaos-store data (D-MPNN
training script, `--splitter 4` imposing our biased_split as its
CATEGORY column; full 53079-molecule store, 42459/5287/5333
train/val/test) via the repo's own DMPNN-Train-pSigma.py, GPU-confirmed
(cu124 torch, driver 595.71.05, "estes" -- see the gpu-server-estes memory
entry). Final checkpoint (~4h10m, 100 epochs): Test MAE 0.827, RMSE 1.777,
R2 0.970 (raw units) -- confirming a real, capable model trained
end-to-end, not just a config-time sanity check. Loss function (checked
from source): plain per-bin MSE, all 51 sigma-profile bins as independent,
equally-weighted regression targets -- no distributional loss (W1) and no
shape/location/magnitude split the way DASH Stage A has.

CORRECTION (2026-08-25, found while investigating T10's profile W1 gap):
MODEL_HPARAMS's active block (hidden_size=51, ffn_num_layers=1, dropout=0.1)
was NEVER actually applied. Checked `inspect.signature(DMPNNModel.__init__)`
against MODEL_HPARAMS's own keys: only `n_tasks`, `atom_fdim`, and
`ffn_activation` are real parameter names on the installed deepchem version.
`dropout`, `message_passing_steps`, `hidden_size`, and `ffn_num_layers` are
NOT -- DMPNNModel.__init__ forwards any unmatched kwarg straight to
`TorchModel.__init__` (`super().__init__(model, ..., **kwargs)`), never to
the `DMPNN` encoder it just built two lines above from its own named
defaults (`enc_hidden=300`, `depth=3`, `ffn_layers=3`,
`enc_dropout_p=ffn_dropout_p=0.0`).

`message_passing_steps=3` deserves its own callout: unlike the other three,
its silent failure is invisible from the trained model's behavior, because
deepchem's own unrelated default for `depth` (message-passing steps, its
real parameter name) also happens to be 3. The script never actually passes
`message_passing_steps` through *at all* -- if the paper's authors had
written `message_passing_steps=5` instead, the real model would still have
silently trained with `depth=3`, and the log would print "5" regardless.
It's not "deepchem correctly interpreting message_passing_steps=3"; it's
deepchem never seeing that key, landing on `depth=3` by coincidence. The
bug is real and identical in kind to the other three -- it just doesn't
produce a visible symptom for this one specific value.

`atom_fdim=35` alone is also
ineffective without `use_default_fdim=False` (deepchem's own docstring:
"if True [the default], self.atom_fdim ... [is] initialized ... from the
GraphConvConstants class" -- ignoring the passed value). Confirmed directly
against our own trained checkpoint's real weights (Folds/fold_00/best_model/
checkpoint5.pt from the 2026-08-24_22-37-20 run, the one behind T9's
predictions CSV): `encoder.W_i.weight` is `(300, 147)` = enc_hidden 300,
atom_fdim 133 + bond_fdim 14 (deepchem's stock RDKit featurization, not the
paper's own 35/12 -- Table 1/2); `ffn.linears.0.weight` is `(300, 300)`,
i.e. a 3-layer FFN (300->300->300->51), not the claimed single layer.

This also fully explains the "checkpoint doesn't match its own log" finding
below (T10's gap #1) without needing the "swap between commits" theory that
seemed like the explanation at the time: every run of this script -- ours
included, run independently, months later, from a fresh venv -- silently
builds this same deepchem-default-shaped model regardless of what
MODEL_HPARAMS or the commented-out "larger, apparently-tuned block" claim;
the training log just echoes MODEL_HPARAMS's dict verbatim, whether or not
those values took effect. The commit-timing observation (`.pt` files added
44 min after the log/results) was real but not causal -- a coincidence, not
the mechanism. T9's actual trained model is therefore deepchem's own
default DMPNN (bigger and richer -- 300 hidden units, 3 FFN layers, 133-dim
atom features, no dropout -- than either the paper describes or than T10
faithfully implements), not the paper's claimed architecture. T9's own
numbers are real and worth keeping (a real model really was trained on
chaos-store and really does predict non-negative-mostly profiles), just
mischaracterized until now as "the paper's hyperparameters" -- see
README.md's T9/T10 sections for the corrected account and what it implies
for the T9-vs-T10 comparison.

WHY THE AUTHORS' OWN CHECKPOINT IS (300, 49), NOT (300, 147) (2026-08-25):
their shipped StratifiedCATEGORY_CV5 checkpoint's encoder.W_i.weight is
(300, 49) = 35 + 14, not our (300, 147) = 133 + 14 -- both used
use_default_fdim=True (never overridden anywhere, confirmed by grep), so
by the mechanism above both should read GraphConvConstants.ATOM_FDIM/
BOND_FDIM unconditionally, ignoring the atom_fdim=35 kwarg entirely.
Checked DMPNNEncoderLayer.__init__ directly:

    if use_default_fdim:
        self.atom_fdim = GraphConvConstants.ATOM_FDIM
        self.concat_fdim = GraphConvConstants.ATOM_FDIM + GraphConvConstants.BOND_FDIM
    else:
        self.atom_fdim = atom_fdim
        self.concat_fdim = atom_fdim + bond_fdim

On our installed (stock, unpatched PyPI) deepchem, GraphConvConstants.
ATOM_FDIM=133, BOND_FDIM=14 (confirmed directly) -- hence our (300, 147).
The only way their run got (300, 49) through this same code path is if
GraphConvConstants.ATOM_FDIM itself equalled 35 in whatever deepchem they
actually used -- i.e. they didn't touch the training script's logic at
all, they patched deepchem's own dmpnn_featurizer.py module, hardcoding
GraphConvConstants.ATOM_FDIM = 35 (and presumably narrowing
ATOM_FEATURES['atomic_num'] to their 8-element vocabulary), so that
use_default_fdim=True silently does the "right" thing only because they'd
redefined what "default" means. This is exactly GitHub issue #1's own
description: "the README says dmpnn_featurizer.py was patched (ALLOWED_
ATOMS = 8 elements, ATOM_FDIM hardcoded to 35)... the patched file isn't
in the repo."

Corollary, not previously noted: BOND_FDIM stayed at deepchem's stock 14
in BOTH checkpoints (49-35=14, 147-133=14) -- only the atom side was ever
patched. So even the authors' own shipped, published model never actually
used the paper's own Table 2 (12-dim bond features) either -- a fourth,
narrower gap layered on top of gap 2 above, not just "the featurizer file
is missing" but "even the file that IS missing only covers half of what
Tables 1-2 together describe."

A first, now-retired predictor (`CosmonetPredictor`, `predictors/
cosmonet.py`) was built directly on top of this training run: a
SMILES-keyed lookup against the training script's own saved
Results/pSigma-{model}.csv, not live re-inference, reproducing
profile/w1_norm_mean 0.224 on chaos-store's biased_split. Retired once
predictors/chemprop_cosmonet.py (T10) superseded it -- a trustworthy,
checkpoint-verified-architecture baseline trained end-to-end on our own
data, with no dependency on the external clone or its saved-CSV lookup
convention. That number is kept here as the historical record of what the
lookup-based approach achieved; it is not reproducible without the deleted
clone and is not a claim about `chemprop_cosmonet`'s own performance (see
`[chemprop_cosmonet]` below for that).
"""

[chaos_store_ua]
notes = """
UNITED-ATOM STORE (2026-08-25). Prompted by a question about DASH's own
atom granularity: is it all-atom or united-atom (implicit H)? Investigated
directly against real chaos-store data and DASH-tree's source
(serenityff/charge/tree/dash_tree.py, atom_features.py) while building T11:

- DASH IS all-atom in what it PREDICTS -- every hydrogen gets its own
  prediction from its own dedicated tree branch (branch 37, the single
  feature tuple (1,1,0,False,0) every H maps to -- AtomFeatures.feature_list
  has exactly one H entry out of 122).
- But it is united-atom in how it REPRESENTS: `_get_init_layer` explicitly
  redirects an H atom's subgraph descent to its heavy-atom neighbor, with
  the authors' own comment "skip Hs as they are only treated implicitly".
  Measured on 2930 real chaos-store atoms: 0 subgraphs ever contain a
  hydrogen. Consequence: an H's prediction is a pure function of its heavy
  atom's environment -- 60.4% of hydrogens in a sample of real chaos-store
  molecules share a bit-identical tree path with another H in the same
  molecule (e.g. both H's of a CH2), so they get IDENTICAL predictions.

Since 56.8% of chaos-store atoms are hydrogen, `atom/*` metrics are
majority-weighted by exactly the atoms DASH represents most crudely -- an
all-atom DASH number and a genuinely united-atom prediction problem are
being conflated under one metric. The fix is not a predictor option: it's
giving DASH (and T11) an atom population that actually matches DASH's own
united-atom design, via a real united-atom STORE, so the same all-atom vs
united-atom question can be asked of every atom-level predictor uniformly.

BUILT VIA cosmolayer's OWN `SegmentStore.coarse_grain()`, not a bespoke
merge: every hydrogen `Chem.RemoveHs` would actually remove gets folded
into its heavy-atom neighbor; a hydrogen RDKit conservatively keeps (a
non-default isotope, or a neighbor with non-tetrahedral stereo it can't
safely represent implicitly) survives as its own atom, same as any heavy
atom -- verified with a synthetic deuterium case (`[2H]`), since chaos-store
itself has zero such survivors in every subsample checked (2000 molecules).

WHY THIS PRESERVES A CONTROLLED COMPARISON: `coarse_grain` drops NO
segments -- only atom PARTITIONING changes. Verified on a 400-molecule
subsample: molecule-level sigma profiles and areas come back BIT-IDENTICAL
between the AA and UA stores. `molecules_df`'s `split`/`biased_split`
columns are also carried through UNCHANGED (not recomputed) --
`prepare_ua_store` (prepare_store.py) enforces this by deriving the UA
store from an already-split AA store rather than re-clustering, so AA and
UA runs use the exact same molecules in the exact same train/val/test
roles. Molecule-level metrics are therefore directly comparable
AA-vs-UA-vs-T10 the same way as any other config change; ATOM-level
metrics are NOT comparable across AA/UA (different atom population,
different targets) and must be reported as separate blocks, never the same
column -- see README's T8/T11 sections for the fuller framing.

CORRECTION (2026-08-25, found while investigating DASH-UA's full-store
numbers): the claim that used to be here -- "DASH's own atom features
already encode H-count... DASH-on-UA is the SAME model, just finally
scored at its own native granularity" -- was WRONG. It was based on
verifying only `GetTotalNumHs(includeNeighbors=True)` invariance (true),
never checking DASH's other feature field, `atom.GetDegree()` (NOT true).
RDKit's `GetDegree()` counts EXPLICIT bonded neighbors only -- it does NOT
include implicit hydrogens. DASH's published tree was built entirely from
all-atom (explicit-H) COSMO representations, where a heavy atom's degree
structurally INCLUDES any bonded H as an explicit neighbor. On the UA
store the same atom's degree drops by however many H's got folded away
(implicit H isn't counted), producing a `(element, degree, charge,
aromatic, nH)` tuple the published vocabulary may never have seen --
either an outright `KeyError` (`init_neighbor_dict` rejects the whole
molecule) or a match against a less-relevant node.

Confirmed directly, e.g. a phosphine-oxide P atom (`...O[PH](C)=O`): AA
tuple `(15, 4, 0, False, 1)` (degree counts the explicit H) vs UA tuple
`(15, 3, 0, False, 1)` (same atom, degree excludes the folded H) -- only
the AA tuple is in DASH's vocabulary. Measured on a 300-molecule
diagnostic sample: 22/300 molecules rejected on UA vs 13/300 on AA, 10 of
which succeed on AA and fail ONLY on UA, every one via this exact
mechanism. This directly explains DASH-UA's full-store regression (see the
results table below) -- DASH-on-UA is NOT "the same model at native
granularity"; it's the same model fed inputs its own hand-built feature
scheme was never designed to represent, since that scheme conflates
"degree" with "explicit-neighbor count" rather than true valence.

CONFIRMED IN THE PRIMARY SOURCE, not just the code (Lehner et al., J. Chem.
Inf. Model. 63, 6014-6028 (2023), "Atom Features" section, p. 6017 -- PDF
at ~/tmp/pdfs/Lehner2023DASH.pdf): the paper lists "Number of bonds (1, 2,
3, 4, 5)" and "Number of attached hydrogens (0, 1, 2, 3)" as two SEPARATE,
independent feature fields, and gives H2 as a worked example: "a hydrogen
atom with one bond and a formal charge of zero has the atom type 'H 1 0
False 0'" -- one bond (to the other H), zero attached hydrogens (H itself
has none). This is only a coherent design if every atom, hydrogen
included, is meant to be an explicit graph node -- exactly `GetDegree()`'s
semantics. So this isn't an implementation quirk to route around; it's
DASH's own designed input contract. A united-atom (implicit-H) input is
outside that contract by construction, not a different but equally valid
way to run the same method.

(Separately investigated and RULED OUT as a comparable issue: does
chemprop's `MultiHotAtomFeaturizer.v2()` have an analogous defect, since
its own nH field also depends on RDKit call defaults? No -- its "number of
Hs" field uses `GetTotalNumHs()` without `includeNeighbors=True`, which
correctly reports 0 for every T11 heavy atom (T11 always keeps H
explicit) -- but this is NOT a bug, it's the standard graph-featurization
convention: "number of hydrogens NOT otherwise represented as graph
nodes." When every H is already an explicit node with its own features
and bonds, 0 implicit H is exactly correct, not lost information --
message passing sees the real H nodes directly. DASH has no such
mechanism (no message passing, a discrete tree lookup only), which is
precisely why the same category of representation-dependence is fatal for
DASH's `GetDegree()` field but not for T11's `GetTotalNumHs()` field.)

NO PREDICTOR CHANGES NEEDED for atom ORDERING/PARSING specifically
(separate from the DASH feature-vocabulary issue above), verified rather
than assumed:
- Both predictors' SMILES/atom-order paths (DASH's plain
  `Chem.SmilesParserParams(removeHs=False)`, T11's
  `make_mol(keep_h=True, add_h=False, reorder_atoms=True)`) parse UA SMILES
  correctly with ZERO code changes: verified 200/200 real coarse-grained
  molecules, element-order-aligned against the UA store's own `atoms_df`,
  for both paths, including the synthetic deuterium-survivor case.
  `keep_h`/`add_h` need care though (a real footgun, worth remembering for
  any future predictor): `keep_h` only RETAINS explicit H already written
  in the SMILES text (`params.removeHs = not keep_h`); it never ADDS one.
  `add_h=True` calls `Chem.AddHs`, which explicitly instantiates every
  IMPLICIT H as a brand-new atom with no atom-map number -- on a UA store
  that would silently balloon the united atoms back toward all-atom and
  break `reorder_atoms`'s map-number sort entirely. Neither predictor sets
  `add_h`; T11 already used `keep_h=True, add_h=False` for the reasons
  above, so it needed no change at all for UA support.
- T10 (molecule-level) needs no re-run on the UA store: it never touches
  atom-level truth, and its plain `Chem.MolFromSmiles(smi)` (default
  `removeHs=True`) produces the identical heavy-atom graph whether parsing
  an AA or a UA SMILES (coarse-graining never touches heavy-atom
  connectivity, only merges peripheral H into their neighbor's implicit-H
  count) -- confirmed by the molecule-level-truth-identity result above.

BUILD COST -- CORRECTED (2026-08-25): the "~0.2s per 400 molecules, ~30s
extrapolated for the full store" estimate above was WRONG, not just
imprecise -- linearly extrapolating a subsample timing hid a real
algorithmic bug rather than measuring it, exactly the mistake this
project's own "run a --limit timing probe before committing to a full run"
discipline (design.md risk #1) exists to prevent. The first real full-store
`coarse-grain-store chaos-store` run was killed after 30+ min of steady
100% CPU with no sign of finishing (confirmed not hung via /proc: advancing
wall clock, stable ~3.5GB RSS, still mid-load with no output written yet).

ROOT CAUSE, found by reading cosmolayer's own source directly:
`SegmentStore.coarse_grain()`'s atom-index remap loop recomputed
`segment_molecule == m` -- a full scan of the ENTIRE segment array -- once
per molecule, plus two more full-length boolean-mask operations per
iteration. O(n_molecules * n_segments), not O(n_segments): chaos-store has
~53,079 molecules and ~99.7M segments, so the loop did on the order of
5.29e12 element-compares total, vs 2.96e8 on the 400-molecule subsample
that "validated" the fast estimate -- 17,861x more work, not the 132x a
molecule-count-only extrapolation predicts. Segments are already
contiguous per molecule by construction (that's what `segment_offsets` is
for), so this is a genuine, fixable performance bug, not something
inherent to coarse-graining.

FIX: cosmolayer PR https://github.com/craabreu/cosmolayer/pull/55 (branch
`fix/coarse-grain-quadratic-remap` off `d3c06e3`, the commit sieve
currently pins) slices each molecule's own contiguous segment range
directly from `segment_offsets` instead of rescanning the full array.
Bit-identical output (all 129 of cosmolayer's own store tests pass
unchanged, including the 5 existing CoarseGrain ones); added a new
regression test using differently-sized fixture molecules so a boundary
slip in the slicing itself would be caught. Measured on synthetic data at
chaos-store's real segment density: 339x faster at n_mols=2000, 1650x at
n_mols=8000, with the ratio growing (confirming O(n^2) vs O(n), not a
constant factor) -- extrapolated full-store: the old loop alone is
40-90 minutes; the new one is under a second.

