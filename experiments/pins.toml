decoupling seen in `[dash_tree]`'s own DASH decomposed-vs-raw comparison
above (atom-level shape and molecule-level shape moved in OPPOSITE
directions between those two retired variants: raw was worse at the atom
level, 1.058 vs 1.030, but better at the molecule level, 0.442 vs 0.449),
and for the same underlying reason: per-atom errors can cancel or compound
when summed, so the two granularities' shape metrics do not move together.
Worth remembering before treating atom-level W1 as a proxy for
molecule-level quality, in either direction.

T11 does not dominate T10: T10 still owns molecule shape (0.219 vs 0.380)
