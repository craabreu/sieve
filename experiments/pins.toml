203,063 atoms, fit 2048s, 0/271,983 rolled-up bins negative):

| metric | DASH dec | DASH raw | chemprop_atom | chemprop_cosmonet |
|---|---|---|---|---|
| atom/profile/w1_norm_mean | 1.030 | 1.058 | 1.055 | -- |
| atom/area/r2 | 0.945 | 0.945 | 0.956 | -- |
