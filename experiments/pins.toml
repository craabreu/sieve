# Pinned external repos for the baseline experiments (see predictors/dash.py,
# predictors/cosmonet.py). `make -C experiments external` clones each at its
# pinned commit into experiments/external/<name>/ (git-ignored).

[dash_tree]
url = "https://github.com/rinikerlab/DASH-tree.git"
commit = "6cf1b2351c4674e602153dd493c06d9c020fc9ce"  # main, 2026-08-24
license = "MIT"
notes = """
Pip-installable (its own pyproject.toml, package name `serenityff`), but
predictors/dash.py uses a sys.path shim instead of `pip install .`: the
default MBIS-charge tree topology ships as ~300MB of .gz/.h5 files under
serenityff/charge/data/default_dash_tree/, and a built wheel is not
confirmed to carry them (no MANIFEST.in / package_data seen in its
pyproject.toml). A plain git checkout guarantees the data travels with the
code; a wheel install might not.

Runtime deps for atom-matching only (confirmed by reading dash_tree.py's
imports and tree_only_env.yml): numpy, pandas, rdkit, tables (pytables),
tqdm, Pillow. No torch/pytorch-geometric needed -- those are only pulled in
by DASH's own GNN-training path (tree_develop/), which Stage A does not use.
These are declared in pyproject.toml's `experiments` extra.

GOTCHA (hit and fixed 2026-08-24): a git clone of DASH-tree left inside this
project's directory tree gets silently absorbed by uv as an implicit
workspace member (it has its own pyproject.toml) -- uv then tries to build
and install "serenityff" into this project's venv/lockfile on every `uv
sync`/`uv lock`/`uv run`. Fixed via `[tool.uv.workspace] exclude =
["experiments/external/*"]` in the root pyproject.toml. If that exclusion
is ever removed, this problem comes back immediately.

GOTCHA 1 (hit and fixed 2026-08-24): at this pinned commit,
`DASHTree(preload=False)` (the on-demand-load mode originally planned, since
it needs no network access) raises `KeyError` on every hydrogen atom:
`_get_init_layer`'s H special-case needs `self.tree_storage[branch_idx]` for
the H-connected heavy atom's own branch before `match_new_atom`'s own
lazy-load runs. Since chaos-store SMILES carry explicit hydrogens
(cosmolayer_adapter's `removeHs=False` convention), this would fall back
every H atom to the global mean. Fixed by defaulting
`DASHBackoffPredictor(preload=True)` (~10s, ~300MB into memory once, still
no network -- the data ships in the clone).

GOTCHA 2 (measured 2026-08-24, NOT fixable on our side): even with
preload=True, ~5% of chaos-store atoms cannot be matched -- but the cause is
NOT gotcha 1. `init_neighbor_dict` raises `KeyError` on any atom whose
feature tuple is outside DASH's published vocabulary (e.g. `(5, 3, 0, False,
3)` = 3-connected boron; Si, Ge, Sb and Te also appear in chaos-store). It
runs over the WHOLE molecule, so one such atom takes every atom in that
molecule down with it -- which is why ordinary H and C dominate the raw
failure counts. Measured on the first 300 chaos-store molecules: 554/11000
atoms, from 13/300 molecules rejected outright. predictors/dash.py counts
these (per split, into the run manifest's `match_stats` and a WARNING) so a
run always records how much of a split fell back to the global mean rather
than being genuinely matched -- this is a baseline-fairness matter, not just
tidiness.

GOTCHA 3 (perf, fixed 2026-08-24): `match_new_atom` rebuilds the entire
molecule's neighbor dict on every call unless one is passed via its
`neighbor_dict=` kwarg -- i.e. O(n_atoms^2) work per molecule. DASH's own
`_get_allAtoms_nodePaths` hoists it per molecule; predictors/dash.py's
`_atom_paths` now does the same, measured 8.5x faster on chaos-store with
bit-identical metrics. This is design.md risk #1's main lever; re-check it
with a `--limit` timing probe before committing to a full-store run.

PAPER PARAMETERS (checked 2026-08-24 against the original preprint, Lehner
et al., J. Chem. Inf. Model. 63, 6014-6028 (2023) / arXiv:2305.15981, read
directly as a PDF rather than trusted from a summarized web fetch):
- `max_depth: 16` matches the paper's own tuned optimum (Sec 3.3 / Fig 9D).
- `attention_threshold`: the paper's tuned optimum is ~5.2 (Fig 10's RMSE-
  vs-threshold sweep; Fig 8's caption gives the more precise "5.23"). The
  paper's own running prose states "0.95" once (Sec 3.3) but that's
  contradicted by both figures and is being treated as a typo/draft leftover
  -- a sub-1 threshold can't be the real stopping criterion, since Fig 11
  shows the *cumulative* attention it's compared against routinely exceeds 1
  as the subgraph grows. Our config previously used `10`, which is just
  `DASHTree.match_new_atom`'s own hardcoded function default, not the
  paper's tuned value -- updated to `5.2` in both dash-*.yaml configs and
  `DASHBackoffPredictor`'s own default, 2026-08-24.
- `minimum_support`: no equivalent was used to build the published/shipped
  tree. Sec 2.4.2 says so explicitly ("the attention could be used as an
  early stopping condition ... not done here"). The only count-based pruning
  anywhere in the DASH-tree codebase is `Node.prune()` in
  `serenityff/charge/tree/node.py` (drops a child with `count < 3` past
  level 3) -- but it is dead code: grepping the whole repo for `.prune(`
  finds only its own recursive self-call, never invoked from
  `Tree_constructor.build_tree()` or either worker module that actually
  builds the shipped tree, and it also mutates `self.children` while
  iterating it (a real bug, consistent with it being an abandoned
  experiment). `minimum_support: 5` in our config remains a Sieve-only
  addition to Stage A's own back-off statistics, with no working precedent
  in DASH itself -- worth documenting as such, not changing.

STAGE A PRECEDENT (checked 2026-08-24 against the DASH-tree authors' own
follow-up, Lehner et al., "DASH properties: Estimating atomic and molecular
properties from a dynamic attention-based substructure hierarchy," J. Chem.
Phys. 161, 074103 (2024)): the authors themselves reuse the published tree
topology (built once from MBIS-charge attention values) to predict several
other target properties (AM1-BCC, Mulliken, RESP charges; dispersion C6;
polarizability; the dual descriptor; molecular dipole/polarizability) by
walking the same fixed topology and dropping each new property's median/
variance into the existing nodes -- their own words: "this population
process does not include any fitting... reusing the DASH tree structure
built for the MBIS partial charges." No GNN retraining, no rebuilt topology.
This is exactly our own Stage A move (fixed published topology, our own
per-node target-property statistics on top), just for a different target
(sigma-profile shape/location/magnitude instead of a scalar property) --
independent precedent that this is a legitimate reuse, not a shortcut, and
context for whoever eventually scopes Stage B (rebuilding the topology
itself, still out of scope for this milestone -- see design.md).
"""

[cosmonet]
url = "https://github.com/snaserib/COSMO-NET-Paper.git"
commit = "366839a0e6f94db65e54dc64068f6266a3f0d914"  # main, 2026-08-25
license = "MIT"
notes = """
Re-cloned 2026-08-25 (the first clone attempt was interrupted by a
disk-space incident on 2026-08-24 -- 106GB free this time, no issue).
Actual checkout size is ~14GB, not the ~4.8GB originally estimated (the
Training/*/​*_saved_model/ dirs ship pretrained checkpoints per
architecture x property x splitter x CV-fold, e.g.
Training/DMPNN/Sigma_saved_model/StratifiedCATEGORY_CV5/ -- these are
trained on COSMO-NET's own CSAC-2002/2010 split, not chaos-store, so they
are a reference/sanity point, not directly usable as our baseline; the
design's intent (retrain with --splitter 4 against our own biased_split
CATEGORY labels) still requires a real training run on chaos-store data).

D-MPNN training script: Training/DMPNN/DMPNN-Train-pSigma.py, invoked with
`--splitter 4` (predefined CATEGORY-column split) to impose our train/val/
test labels -- see the design doc for the intended predictors/cosmonet.py
integration. Input format (Data/CSAC-2002.csv, Data/CSAC-2010.csv):
CanonicalSMILES + a CATEGORY column (Training/Validation/Test) + a 51-point
sigma profile at columns "-0.025".."0.025" -- matches our own DEFAULT_GRID
exactly (51 points, ±0.025 e/Å², bin width 0.001), so a chaos-store ->
CSAC-format CSV only needs SMILES + molecule-level sigma profile + our own
biased_split relabeled into CATEGORY. Not yet built.

Dependency resolution (design.md risk #3, "largest schedule risk in the
milestone") DONE and clean -- see `experiments/cosmonet-requirements.txt`
for the full pin and exact repro steps. Needs its own uv-managed venv
(Python 3.10, matching the GPU server "estes" -- see the gpu-server-estes
memory entry) with a CUDA-enabled torch build (cu124 wheels, driver
595.71.05 / toolkit 12.9 on this machine, backward compatible). One real
gotcha: torch-geometric is required by deepchem.models.torch_models.
DMPNNModel but is NOT listed in the repo's own requirements.txt --
deepchem swallows the missing-torch_geometric ImportError internally and
only surfaces it as a confusing `cannot import name 'DMPNNModel'` from
whatever imports it, not as a torch_geometric error. Full stack
(torch+cu124, tensorflow, deepchem 2.8.0, torch-geometric, rdkit)
smoke-tested end-to-end: DMPNN-Train-pSigma.py --n_epochs 1 on the repo's
own CSAC-2002.csv (16130 molecules) featurizes, trains, and evaluates on
GPU without error (Test R2 0.89 after 1 epoch -- their data, not ours,
pipeline sanity check only).

Next step for T9: build the chaos-store -> CSAC-format CSV (SMILES + our
own molecule sigma profile + biased_split-as-CATEGORY), then run a real
training pass and wire predictors/cosmonet.py against the Predictor seam,
joining results back by SMILES (design.md risk #4 -- COSMO-NET's row order
is not guaranteed).

FIRST FULL-DATA PASS (2026-08-25): built the converter
(sieve_experiments/cosmonet_data.py, `category_labels` +
`write_cosmonet_csv`, tested in
experiments/tests/test_experiment_cosmonet_data.py). Wrote the real
full-store CSV to experiments/external/COSMO-NET-Paper/Data/
chaos-store-biased.csv (53079 molecules: 42459 Training / 5287 Validation /
5333 Test, from `biased_split` -- git-ignored, regenerate with the snippet
below). Confirmed sigma-column magnitudes are sane (each row sums to its
own `area [A^2]`, same convention as COSMO-NET's own CSAC rows).

A `--n_epochs 1` timing probe on the real full CSV: 4m18s, **Test R2 0.915,
MAE 1.40** (raw units) -- already strong after a single epoch. The repo's
own training script default is `--n_epochs 100` (~7.2h at this rate, no
CV), which is a real time commitment, so it was launched as a detached
background job rather than run inline:

    cd experiments/external/COSMO-NET-Paper/Training/DMPNN
    source ../../.venv/bin/activate
    nohup python DMPNN-Train-pSigma.py --n_epochs 100 \
        --data_path ../../Data/chaos-store-biased.csv \
        > ../../../../runs/cosmonet-logs/dmpnn-full-100ep.log 2>&1 < /dev/null &
    disown

Started 2026-08-25 ~02:37 UTC. This was launched with plain `nohup`/
`disown`, NOT the harness's own tracked background-Bash mechanism (that
mechanism re-invokes the session automatically on exit; a manually
disowned process does not) -- so nothing auto-notifies on completion.
Check progress with `tail experiments/runs/cosmonet-logs/dmpnn-full-100ep.
log` (git-ignored) or `pgrep -fa DMPNN-Train-pSigma.py`; it prints Train/
Valid/Test MAE/RMSE/R2 and a `Sigma_saved_model/<timestamp>_
StratifiedCATEGORY_single/` checkpoint path when done. Still needed after
that: wire predictors/cosmonet.py to load the trained checkpoint and
predict against the Predictor seam.

TRAINING FINISHED (2026-08-25 ~02:47 UTC, ~4h10m total, faster than the 7.2h
estimate): Sigma_saved_model/2026-08-24_22-37-20_StratifiedCATEGORY_single/.
Test MAE 0.827, RMSE 1.777, R2 0.970 (raw units) -- up from the 1-epoch
checkpoint's 1.40/-/0.915. GPU use confirmed both empirically (`nvidia-smi
--query-compute-apps` showed this exact PID allocating GPU memory while
running) and from source (deepchem's TorchModel defaults device=None ->
auto-picks cuda when available; DMPNN-Train-pSigma.py never overrides it).
Split re-certified against this final run's own output too (not just the
1-epoch probe): 53079/53079 rows, 0 mismatches.

Loss function (checked from source, since the training script never
overrides it): plain per-bin MSE (`L2Loss` -> `torch.nn.functional.
mse_loss`), all 51 sigma-profile bins as independent, equally-weighted
regression targets (`n_tasks=51`) -- no distributional loss (W1) and no
shape/location/magnitude split the way DASH Stage A has. Active
MODEL_HPARAMS is the script's smaller block (hidden_size=51,
ffn_num_layers=1, dropout=0.1); a larger block (hidden_size=512,
ffn_num_layers=5, dropout=0.2319021895799188 -- specific enough to look
tuned) is commented out just above it, unexplored here.

predictors/cosmonet.py (CosmonetPredictor) is written and tested
(experiments/tests/test_experiment_predictor_cosmonet.py, 7 tests). It is a
SMILES-keyed lookup against the training script's own saved
Results/pSigma-{model}.csv, not live re-inference -- see the module
docstring for the full reasoning, including a CATEGORY/split-column
leakage guard (fit_molecules/predict_molecules re-certify every molecule's
CATEGORY against what the current run's split expects, every run, raising
if a predictions CSV built from a *different* split_column is pointed at
by mistake).

Stable-path convention: rather than pointing configs at a timestamped
Sigma_saved_model/<ts>_StratifiedCATEGORY_single/ dir (not reproducible-by-
name across retrains), the winning run's Results/pSigma-DMPNN.csv was
copied to a fixed, documented name:

    cp Training/DMPNN/Sigma_saved_model/2026-08-24_22-37-20_StratifiedCATEGORY_single/Folds/fold_00/Results/pSigma-DMPNN.csv \
       Training/DMPNN/cosmonet-chaos-store-biased-predictions.csv

configs/cosmonet-biased.yaml points at that stable path. A real harness run
(`--config configs/cosmonet-biased.yaml --allow-dirty --no-tracking`)
reproduces the manually-verified numbers bit-for-bit in 2.7s wall (pure
lookup): profile/w1_norm_mean 0.224 vs DASH's 0.449 and global_mean's 1.024
-- see README.md's T9 section for the full comparison table and caveats.

configs/cosmonet-random.yaml has NO trained checkpoint yet (only
biased_split has been trained) -- its predictions_csv points at a
not-yet-created file by design, so the CATEGORY guard above would reject a
biased_split CSV if someone pointed it there by mistake.
"""
