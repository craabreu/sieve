CORRECTION (2026-08-25, found while investigating T10's profile W1 gap):
MODEL_HPARAMS's active block (hidden_size=51, ffn_num_layers=1, dropout=0.1)
was NEVER actually applied. Checked `inspect.signature(DMPNNModel.__init__)`
against MODEL_HPARAMS's own keys: only `n_tasks`, `atom_fdim`, and
`ffn_activation` are real parameter names on the installed deepchem version.
`dropout`, `message_passing_steps`, `hidden_size`, and `ffn_num_layers` are
NOT -- DMPNNModel.__init__ forwards any unmatched kwarg straight to
`TorchModel.__init__` (`super().__init__(model, ..., **kwargs)`), never to
the `DMPNN` encoder it just built two lines above from its own named
defaults (`enc_hidden=300`, `depth=3`, `ffn_layers=3`,
`enc_dropout_p=ffn_dropout_p=0.0`).

`message_passing_steps=3` deserves its own callout: unlike the other three,
its silent failure is invisible from the trained model's behavior, because
deepchem's own unrelated default for `depth` (message-passing steps, its
real parameter name) also happens to be 3. The script never actually passes
`message_passing_steps` through *at all* -- if the paper's authors had
written `message_passing_steps=5` instead, the real model would still have
silently trained with `depth=3`, and the log would print "5" regardless.
It's not "deepchem correctly interpreting message_passing_steps=3"; it's
deepchem never seeing that key, landing on `depth=3` by coincidence. The
bug is real and identical in kind to the other three -- it just doesn't
produce a visible symptom for this one specific value.

`atom_fdim=35` alone is also
ineffective without `use_default_fdim=False` (deepchem's own docstring:
"if True [the default], self.atom_fdim ... [is] initialized ... from the
GraphConvConstants class" -- ignoring the passed value). Confirmed directly
against our own trained checkpoint's real weights (Folds/fold_00/best_model/
checkpoint5.pt from the 2026-08-24_22-37-20 run, the one behind T9's
predictions CSV): `encoder.W_i.weight` is `(300, 147)` = enc_hidden 300,
atom_fdim 133 + bond_fdim 14 (deepchem's stock RDKit featurization, not the
paper's own 35/12 -- Table 1/2); `ffn.linears.0.weight` is `(300, 300)`,
i.e. a 3-layer FFN (300->300->300->51), not the claimed single layer.

This also fully explains the "checkpoint doesn't match its own log" finding
below (T10's gap #1) without needing the "swap between commits" theory that
seemed like the explanation at the time: every run of this script -- ours
included, run independently, months later, from a fresh venv -- silently
builds this same deepchem-default-shaped model regardless of what
MODEL_HPARAMS or the commented-out "larger, apparently-tuned block" claim;
the training log just echoes MODEL_HPARAMS's dict verbatim, whether or not
those values took effect. The commit-timing observation (`.pt` files added
44 min after the log/results) was real but not causal -- a coincidence, not
the mechanism. T9's actual trained model is therefore deepchem's own
default DMPNN (bigger and richer -- 300 hidden units, 3 FFN layers, 133-dim
atom features, no dropout -- than either the paper describes or than T10
faithfully implements), not the paper's claimed architecture. T9's own
numbers are real and worth keeping (a real model really was trained on
chaos-store and really does predict non-negative-mostly profiles), just
mischaracterized until now as "the paper's hyperparameters" -- see
README.md's T9/T10 sections for the corrected account and what it implies
for the T9-vs-T10 comparison.

WHY THE AUTHORS' OWN CHECKPOINT IS (300, 49), NOT (300, 147) (2026-08-25):
their shipped StratifiedCATEGORY_CV5 checkpoint's encoder.W_i.weight is
(300, 49) = 35 + 14, not our (300, 147) = 133 + 14 -- both used
use_default_fdim=True (never overridden anywhere, confirmed by grep), so
by the mechanism above both should read GraphConvConstants.ATOM_FDIM/
BOND_FDIM unconditionally, ignoring the atom_fdim=35 kwarg entirely.
Checked DMPNNEncoderLayer.__init__ directly:

    if use_default_fdim:
        self.atom_fdim = GraphConvConstants.ATOM_FDIM
        self.concat_fdim = GraphConvConstants.ATOM_FDIM + GraphConvConstants.BOND_FDIM
    else:
        self.atom_fdim = atom_fdim
        self.concat_fdim = atom_fdim + bond_fdim

On our installed (stock, unpatched PyPI) deepchem, GraphConvConstants.
ATOM_FDIM=133, BOND_FDIM=14 (confirmed directly) -- hence our (300, 147).
The only way their run got (300, 49) through this same code path is if
GraphConvConstants.ATOM_FDIM itself equalled 35 in whatever deepchem they
actually used -- i.e. they didn't touch the training script's logic at
all, they patched deepchem's own dmpnn_featurizer.py module, hardcoding
GraphConvConstants.ATOM_FDIM = 35 (and presumably narrowing
ATOM_FEATURES['atomic_num'] to their 8-element vocabulary), so that
use_default_fdim=True silently does the "right" thing only because they'd
redefined what "default" means. This is exactly GitHub issue #1's own
description: "the README says dmpnn_featurizer.py was patched (ALLOWED_
ATOMS = 8 elements, ATOM_FDIM hardcoded to 35)... the patched file isn't
in the repo."

Corollary, not previously noted: BOND_FDIM stayed at deepchem's stock 14
in BOTH checkpoints (49-35=14, 147-133=14) -- only the atom side was ever
patched. So even the authors' own shipped, published model never actually
used the paper's own Table 2 (12-dim bond features) either -- a fourth,
narrower gap layered on top of gap 2 above, not just "the featurizer file
is missing" but "even the file that IS missing only covers half of what
Tables 1-2 together describe."

predictors/cosmonet.py (CosmonetPredictor) is written and tested
(experiments/tests/test_experiment_predictor_cosmonet.py, 7 tests). It is a
SMILES-keyed lookup against the training script's own saved
Results/pSigma-{model}.csv, not live re-inference -- see the module
docstring for the full reasoning, including a CATEGORY/split-column
leakage guard (fit_molecules/predict_molecules re-certify every molecule's
CATEGORY against what the current run's split expects, every run, raising
if a predictions CSV built from a *different* split_column is pointed at
by mistake).

Stable-path convention: rather than pointing configs at a timestamped
Sigma_saved_model/<ts>_StratifiedCATEGORY_single/ dir (not reproducible-by-
name across retrains), the winning run's Results/pSigma-DMPNN.csv was
copied to a fixed, documented name:

    cp Training/DMPNN/Sigma_saved_model/2026-08-24_22-37-20_StratifiedCATEGORY_single/Folds/fold_00/Results/pSigma-DMPNN.csv \
       Training/DMPNN/cosmonet-chaos-store-biased-predictions.csv

configs/cosmonet-biased.yaml points at that stable path. A real harness run
(`--config configs/cosmonet-biased.yaml --allow-dirty --no-tracking`)
reproduces the manually-verified numbers bit-for-bit in 2.7s wall (pure
lookup): profile/w1_norm_mean 0.224 vs DASH's 0.449 and global_mean's 1.024
-- see README.md's T9 section for the full comparison table and caveats.

configs/cosmonet-random.yaml has NO trained checkpoint yet (only
biased_split has been trained) -- its predictions_csv points at a
not-yet-created file by design, so the CATEGORY guard above would reject a
biased_split CSV if someone pointed it there by mistake.
"""

[chemprop]
# A PyPI version pin, not a git SHA -- chemprop is a real pip dependency
# (pyproject.toml's `chemprop` extra), unlike DASH-tree/COSMO-NET-Paper's
# sys.path/subprocess clones. Installed via `uv sync --extra chemprop`.
version = "2.3.1"  # requires-python >=3.11,<3.15
license = "MIT"
notes = """
T10: a from-scratch D-MPNN sigma-profile predictor. Originally built to
reproduce COSMO-NET's published architecture (Naseri Boroujeni et al., Mol.
Syst. Des. Eng., 2026, DOI 10.1039/d6me00088f) directly from the paper's
Tables 1-2 and Section 2.2.2; REVISED 2026-08-25 (see the "REVISION" note
near the end) to instead reproduce the architecture COSMO-NET-Paper's own
script *actually trains* -- confirmed by direct inspection to differ from
what the paper's own text claims, in several ways beyond what was first
found. Not from COSMO-NET-Paper's own repo either way (snaserib/
COSMO-NET-Paper, pinned above), which has three independently-confirmed
reproducibility gaps found while investigating T9's negative-sigma-bin
issue:
  1. the shipped StratifiedCATEGORY_CV5 checkpoint's weights (hidden_size=
     300, ffn_num_layers=3) contradict the hyperparameters printed in its
     own committed training log (hidden_size=51, ffn_num_layers=1) -- root
     cause found 2026-08-25 (see [cosmonet]'s CORRECTION note above): the
     training script's MODEL_HPARAMS keys mostly don't match real
     DMPNNModel.__init__ parameter names on the installed deepchem, so they
     get silently absorbed into TorchModel's **kwargs and never reach the
     encoder -- every run, not just this checkpoint, builds deepchem's own
     default-shaped model regardless of what the log echoes back;
  2. the atom featurizer needed to reproduce that checkpoint (atom_fdim=35
     vs deepchem's stock 133) was never published -- independently confirmed
     in that repo's own GitHub issue #1, unanswered since 2026-08-09; the
     mechanism is a patched deepchem module (GraphConvConstants.ATOM_FDIM
     hardcoded to 35), not a script-level flag -- see [cosmonet]'s "WHY THE
     AUTHORS' OWN CHECKPOINT IS (300, 49)" note above for the full trace.
     Narrower than it first looked, too: BOND_FDIM stayed at deepchem's
     stock 14 in their checkpoint as well (49-35=14) -- only the atom side
     was ever patched, so even their own shipped model never used the
     paper's own Table 2 (12-dim bond features) either;
  3. the published training script has no non-negativity enforcement
     anywhere in its prediction path, yet its own published results CSV has
     exactly 0% negative bins across all 5 folds.
See README.md's T10 section for the full account.

Dependency resolution (2026-08-25) into the MAIN venv (not a separate one,
unlike T9's cosmonet venv): `uv sync --extra chemprop` resolved cleanly on
the first try, no conflicts. rdkit stayed at 2026.03.5 (chemprop's own
transitive pin `cuik_molmaker_pin==2026.3.5` requires exactly that rdkit
version, and it happened to already match -- a future rdkit bump could
require watching this). torch (2.13.0+cu130, CUDA available) and lightning
(2.6.5) were already present transitively via cosmolayer's `experiments`
extra, so this added no new heavy stack, just chemprop itself plus its own
tail (myerson, descriptastorus, astartes, cuik_molmaker_pin, padelpy,
mordredcommunity, aimsim-core, xarray -- none of which this predictor
actually uses; they come along with the `chemprop` import regardless).

Architecture notes (see predictors/chemprop_dmpnn.py's module docstring for
the full reasoning):
- Two real gotchas found while building this, beyond ordinary API mapping:
  (a) chemprop's `MLP.build(n_layers=...)` counts *additional* hidden layers
  beyond the direct input->output projection -- the paper's "ffn_num_layers
  =1" (one FFN layer, no hidden layer) is chemprop's `n_layers=0`, confirmed
  by inspecting `MLP.build` directly (n_layers=0 -> one Linear; n_layers=1
  -> two). Using chemprop's n_layers=1 would silently build a deeper FFN
  than the paper describes.
  (b) `pl.Trainer(accelerator="auto")` alone silently launched multi-GPU DDP
  on this machine's 2 GPUs, splitting the val/test batch across ranks --
  caught as a metrics shape mismatch in the first end-to-end test run
  (profile_true had 10 rows, profile_pred had 5, half lost to the other
  rank). Fixed with an explicit `devices=1`.
- chemprop's built-in atom featurizer cannot hit the paper's exact 35
  dimensions (mandatory "unknown" pad bits push it to 41), so
  PaperAtomFeaturizer is a custom, duck-typed class (not a
  chemprop.featurizers.base.VectorFeaturizer subclass, so it stays
  importable and unit-testable without chemprop -- confirmed empirically
  that chemprop accepts plain duck-typed featurizers with no isinstance
  check anywhere in the call path). The bond side, after the REVISION
  below, uses chemprop's own built-in MultiHotBondFeaturizer() directly --
  its 14-dim default turns out to be structurally identical to deepchem's
  real (never-patched) bond featurization, so no custom class is needed
  there at all.
- Non-negativity is structural, not a post-hoc clip: softplus sits on the
  FFN's raw scaled-space output, before UnscaleTransform (min-max, built
  manually since chemprop's own normalize_targets() is z-score only). Since
  min-max scaling's y_min >= 0 for every profile bin, softplus(x) > 0
  composed with unscaling guarantees p(sigma) > 0 for every prediction --
  verified end to end: the first real fit/predict run through the harness
  (--limit 40, max_epochs=1) produced zero negative bins.

First full-store run (paper-faithful architecture, hidden_size=51,
ffn_n_layers=0, dropout=0.1, sum pooling, atom/bond=35/12), 2026-08-25:
1363.5s, profile/w1_norm_mean 0.397, area/r2 0.731, charge/mae 0.0538,
0/271,983 negative bins (0.0000%) verified directly against
predictions.npz, vs T9's measured 19.6%. Superseded by the REVISION below
-- kept here as the record of what "faithfully implementing the paper's
own claimed hyperparameters" actually produces, distinct from what the
REVISION's numbers below now describe.

REVISION (2026-08-25, prompted by the user pointing out the W1-vs-T9
comparison "makes no sense" -- an initial guess of "optimizer/init
differences" turned out to be wrong; the real explanation, and this
revision, follow from it): investigating that gap found T9's actual
trained model was never running the paper's claimed architecture at all
(see [cosmonet]'s CORRECTION note) -- it is deepchem's own silently-
defaulted DMPNN. Verified precisely, not by inference:
- hidden_size: 51 -> 300 (`enc_hidden`'s real default).
- FFN depth: the paper's "ffn_num_layers=1" -> deepchem's real ffn_layers=3.
  Getting the chemprop-side count right required tracing BOTH frameworks'
  layer-counting conventions directly, since they disagree by one:
  deepchem's PositionwiseFeedForward.__init__ treats n_layers as the TOTAL
  Linear-layer count (confirmed by reading its source: n_layers=3 builds
  exactly 3 nn.Linear); chemprop's own MLP.build(n_layers=N) instead yields
  N+1 total layers (an *additional*-hidden-layers count, confirmed
  separately for the original, now-superseded ffn_num_layers=1 case). So
  deepchem's real ffn_layers=3 needs chemprop's n_layers=2, not 3 and not
  the original 0. Locked in by a dedicated test
  (test_default_ffn_has_the_deepchem_equivalent_layer_count) that counts
  actual nn.Linear submodules rather than trusting either framework's
  parameter name.
- dropout: 0.1 -> 0.0 (`enc_dropout_p`/`ffn_dropout_p` both default to 0.0).
- Bond features: the paper's own 12-dim Table 2 -> deepchem's real,
  never-patched 14-dim stock featurization -- structurally identical to
  chemprop's own built-in MultiHotBondFeaturizer() default, so that's used
  directly now instead of a custom PaperBondFeaturizer (removed).
- Readout: sum -> mean pooling. Not just an ignored kwarg landing back on a
  default that happens not to matter (like depth=3, which coincidentally
  matches the paper's own intent) -- `aggregation` isn't in MODEL_HPARAMS
  at all (grepped, absent), so this is the real model doing something the
  paper's own eqn 11 explicitly says it doesn't do.
- Atom features (35-dim, Table 1) are UNCHANGED -- this is the one part of
  the paper's claimed architecture that genuinely was realized (patched
  into deepchem's own GraphConvConstants.ATOM_FDIM, per [cosmonet]'s "WHY
  THE AUTHORS' OWN CHECKPOINT IS (300, 49)" note), so PaperAtomFeaturizer
  stays exactly as it was.
- Not replicated: the real run's optimizer/LR schedule
  (ExponentialDecay(initial_rate=0.001, decay_rate=0.95, decay_steps=1000),
  set directly in the script rather than via the broken MODEL_HPARAMS dict,
  so genuinely applied) vs chemprop's own default Adam + Noam-like warmup.
  Would need subclassing MPNN.configure_optimizers -- a documented,
  deliberately-deferred remaining deviation.

New architecture: 401K params (vs the original's 12.1K) -- confirmed via
lightning's own model summary table at fit time. A --limit 5000 timing
probe (100 real epochs): 122.3s -- barely different from the original,
much smaller model's 127.8s at the same scale (small-batch GPU training
here is overhead-bound, not compute-bound, so 33x more parameters barely
moves wall time), and already promising: profile/w1_norm_mean 0.301 at
this scale vs the original architecture's 0.577.

Full-store run (biased_split, 100 epochs), revised architecture,
2026-08-25: 1337.8s (22.3 min, matching the probe's extrapolation almost
exactly). profile/w1_norm_mean 0.2194, area/r2 0.828, charge/mae 0.0201,
0/271,983 negative bins (0.0000%) verified directly against
predictions.npz -- structural non-negativity holds regardless of
architecture size, exactly as expected (softplus+min-max unscaling
guarantees it independent of hidden_size/depth/dropout).

T10 now BEATS T9 on both profile shape (0.2194 vs 0.224) and area (0.828
vs 0.775) -- unsurprising once the architecture correction above is
understood: T10 now runs the same real architecture T9 accidentally used,
built cleanly (proper softplus non-negativity, proper min-max scaling from
train-set stats only, no silently-broken kwargs) rather than by accident.
The comparison that "made no sense" (T10 worse than T9 despite claimed
same architecture) is fully resolved: they were never comparable before
(different real architectures under an identical-looking config), and now
they are (same real architecture, T10 built deliberately). See README.md's
T9/T10 sections for the full comparison table.

LOSS_MODE EXPERIMENT (2026-08-25): the user asked to test two alternative
training losses against the default per-bin MSE -- ``w1_normalized``
(Wasserstein-1 on each profile normalized by its own row sum, a pure shape
loss) and ``mse_cumsum`` (MSE on the profiles' raw cumulative sums, a joint
shape+magnitude loss) -- see predictors/chemprop_dmpnn.py's module
docstring for both formulas and the ``_UnscalingRowLoss`` base class (both
need real, unscaled units to mean anything physically, since per-bin
min-max scaling makes a row-sum/cumsum on the *scaled* tensor meaningless).

A --limit 5000 probe for both, then a full-store run for w1_normalized only
(mse_cumsum's probe result didn't justify the ~22 min full-store cost --
user's call, not run):

| loss_mode | scale | w1_norm_mean | area/r2 | charge/mae |
|---|---|---|---|---|
| mse (default) | 5000 | 0.301 | -0.157 | -- |
| w1_normalized | 5000 | 0.266 | not meaningful* | not meaningful* |
| mse_cumsum | 5000 (probe only) | 0.564 | 0.058 | -- |
| mse (default) | full store | 0.2194 | 0.828 | 0.0201 |
| w1_normalized | full store | **0.2071** | not meaningful* | not meaningful* |

(*) area/r2 and charge/mae are NOT reported as numbers for w1_normalized,
deliberately -- quoting -1822/-243 (the raw values this run actually
produced) would misrepresent what happened. This loss gives the network
literally zero gradient for overall scale (both prediction and target are
divided by their own row sum before the loss ever sees them), so area was
never something the model was trying and failing to predict -- it's an
untrained, free-floating byproduct of whatever scale the optimizer
happened to wander to, not a real predictive failure on a real target.
Reporting an R2/MAE on it invites exactly the wrong reading (that the
model attempted magnitude and got it badly wrong), so it's correctly
described here as "not meaningful," not scored. (For the record, since it
was mentioned before this correction: full-store predicted areas landed in
1250-5437 vs a true range of 114-520 -- illustrating *why* it's
unscored, not a metric to cite.)

w1_normalized's full-store profile shape is the best of any config tried
in this whole milestone (0.2071, beating even the default-loss T10's
0.2194). 0/271,983 negative bins confirmed on this run too -- non-negativity
is architecture-level (softplus), not loss-level, and holds regardless of
which of the three loss_modes is used (also covered by a dedicated
parametrized optional test).

mse_cumsum's probe-scale numbers (w1_norm_mean 0.564, worse shape than
both alternatives; area/r2 0.058, better than plain mse's -0.157 at the
same scale but a marginal gain) didn't justify a full run. Recorded as a
probe-only result, not a full-store one.

Takeaway: neither alternative loss is a straightforward improvement over
the default MSE for this architecture/task. w1_normalized would need an
explicit magnitude term (e.g. combined with an area MSE, mirroring the
user's own SigmaProfileLoss's shape+area+charge combination) to be usable
on its own; mse_cumsum's cost (worse shape) wasn't worth its benefit
(marginal area) even at probe scale. Kept as documented `loss_mode` options
on ChempropDMPNNPredictor for future experimentation, not adopted as a new
default -- `chemprop-biased.yaml`/`chemprop-random.yaml` stay on
`loss_mode="mse"`.

T11 -- PER-ATOM CHEMPROP (2026-08-25): predictors/chemprop_atom.py, a
`MolAtomBondMPNN` predicting one 51-bin profile per ATOM off that atom's own
message-passing hidden state, with `agg=None` and no molecule/bond head at
all. Molecule-level numbers come from the harness's own `roll_up` of those
atom predictions, so they are a pure readout of atom quality rather than a
separately-trained head. Same recipe as T10 otherwise (raw unnormalized
bins, per-bin min-max scaling fit on train only, plain MSE).

GOTCHA 1 (the big one -- SOFTPLUS DOES NOT TRANSFER TO ATOM LEVEL): T10's
softplus output collapses completely here. A softplus atom model predicts
IDENTICALLY ZERO and cannot overfit even 20 molecules. Mechanism, and it is
purely structural, not a tuning problem: `softplus(x) = 0` only as
`x -> -inf`, and atom profiles are **81.4% exact zeros** (each atom occupies
only ~9.5 of the 51 bins; a molecule profile is far denser -- 50.2% zeros,
25.4 bins populated). MSE therefore drives the majority of outputs toward
exactly zero, pushing pre-activations to -inf, which is precisely where
softplus's own derivative `sigmoid(x)` vanishes -- the head dies and never
recovers. T10 never hit this because molecule-level targets are dense and
never need the output driven to exact zero. Measured, 20-molecule overfit,
true mean atom area 7.676:

| output activation | w1 | predicted area | negative bins |
|---|---|---|---|
| softplus (T10's) | 6.717 | 0.000 | 0 (dead) |
| **squared (x**2)** | **0.878** | **7.859** | **0** |
| abs | 0.947 | 7.939 | 0 |
| plain linear | 0.825 | 7.786 | 13110 |

`x**2` is the adopted default: equally structurally non-negative (the
activation still sits on the raw output, before unscaling, and every profile
bin's train min is exactly 0 so `y_min >= 0`), but a target of exactly zero
is reachable at the finite point `x = 0`, so no gradient dies. It costs
essentially nothing against an unconstrained linear head (0.878 vs 0.825)
which would emit 13k negative bins and forfeit the structural guarantee that
was T10's whole selling point. Selectable via `output_activation`;
`"softplus"` stays available so the collapse above stays reproducible. The
FFN factory is shared with T10 (`chemprop_dmpnn.nonneg_regression_ffn_class`)
so the activation-before-unscale invariant is defined exactly once.

GOTCHA 2 (atom featurizer): T10's `PaperAtomFeaturizer` (the paper's Table 1,
8 elements {C,N,O,S,F,P,Cl,Br}) is unusable per-atom -- it has **no
hydrogen**, and 56.8% of chaos-store atoms are hydrogen once the graph keeps
explicit H (which it must, since the store has atom-level truth for every
atom). T11 uses chemprop's own `MultiHotAtomFeaturizer.v2()` (72-dim, Z=1-36
plus 53), covering every chaos-store element except Sb and Te.

GOTCHA 3 (atom ordering -- the silent-corruption risk): chemprop's own
`make_mol(smi, keep_h=True, add_h=False, reorder_atoms=True)` renumbers atoms
by atom-map number, which IS the store's own flat atom order, so **no manual
permutation is needed** -- unlike predictors/dash.py, which does its own
`np.argsort(GetAtomMapNum())`. Verified but never assumed. Dropping
`reorder_atoms=True` changes the element sequence for 38 of 40 test molecules
and mismatches 16.0% of atoms, so the guard genuinely discriminates. Note
also that `CuikmolmakerDataset` must NOT be used: it ignores `_reorder_atoms`
and featurizes in raw textual order (a known chemprop bug), which would
silently misalign every atom-level target.

GOTCHA 4 (a shape check cannot catch a shuffled predict loader):
`build_dataloader` shuffles MOLECULES, and each molecule's atoms travel with
it as a contiguous block -- so a shuffled loader returns the exact same
`(n_atoms, 51)` array shape, just with molecule blocks permuted. The guard is
therefore a per-molecule atom-count sequence check recovered from each
batch's own `bmg.batch`, not an assert on the array shape.

FULL-STORE RESULTS (2026-08-25, biased_split, n_test 5333 molecules /
203,063 atoms, fit 2048s, 0/271,983 rolled-up bins negative):

| metric | DASH dec | DASH raw | chemprop_atom | chemprop_dmpnn |
|---|---|---|---|---|
| atom/profile/w1_norm_mean | 1.030 | 1.058 | 1.055 | -- |
| atom/area/r2 | 0.945 | 0.945 | 0.956 | -- |
| atom/charge/mae | 0.00752 | 0.00752 | 0.00726 | -- |
| profile/w1_norm_mean | 0.449 | 0.442 | 0.380 | 0.219 |
| area/r2 | 0.949 | 0.949 | 0.943 | 0.828 |
| charge/mae | 0.102 | 0.102 | 0.0792 | 0.0201 |

The notable result is that a *learned* per-atom model does NOT clearly beat
averaging over DASH's published tree at the atom level: atom shape is
essentially tied (1.055 vs DASH decomposed's 1.030, DASH raw's 1.058), and
T11 wins atom area/charge only modestly. It IS clearly ahead once rolled up
to molecules (0.380 vs 0.449/0.442) -- the same atom-vs-molecule shape
decoupling the T8 profile_mode experiment found, and for the same reason:
per-atom errors can cancel or compound when summed, so the two granularities'
shape metrics do not move together. Worth remembering before treating
atom-level W1 as a proxy for molecule-level quality, in either direction.

T11 does not dominate T10: T10 still owns molecule shape (0.219 vs 0.380)
and molecule charge (0.0201 vs 0.0792), since it optimizes the molecule
profile directly while T11's molecule numbers are an unoptimized by-product
of summing atoms; T11 owns area (0.943 vs 0.828). Report both, not one.
"""
