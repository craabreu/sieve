The notable result is that a *learned* per-atom model does NOT clearly beat
averaging over DASH's published tree at the atom level: atom shape is
essentially tied (1.055 vs DASH decomposed's 1.030, DASH raw's 1.058), and
T11 wins atom area/charge only modestly. It IS clearly ahead once rolled up
