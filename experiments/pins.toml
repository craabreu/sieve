REVISION (2026-08-25, prompted by the user pointing out the W1-vs-T9
comparison "makes no sense" -- an initial guess of "optimizer/init
differences" turned out to be wrong; the real explanation, and this
revision, follow from it): investigating that gap found T9's actual
trained model was never running the paper's claimed architecture at all
(see [cosmonet_investigation]'s CORRECTION note) -- it is deepchem's own silently-
defaulted DMPNN. Verified precisely, not by inference:
- hidden_size: 51 -> 300 (`enc_hidden`'s real default).
- FFN depth: the paper's "ffn_num_layers=1" -> deepchem's real ffn_layers=3.
  Getting the chemprop-side count right required tracing BOTH frameworks'
  layer-counting conventions directly, since they disagree by one:
  deepchem's PositionwiseFeedForward.__init__ treats n_layers as the TOTAL
  Linear-layer count (confirmed by reading its source: n_layers=3 builds
  exactly 3 nn.Linear); chemprop's own MLP.build(n_layers=N) instead yields
  N+1 total layers (an *additional*-hidden-layers count, confirmed
  separately for the original, now-superseded ffn_num_layers=1 case). So
  deepchem's real ffn_layers=3 needs chemprop's n_layers=2, not 3 and not
  the original 0. Locked in by a dedicated test
  (test_default_ffn_has_the_deepchem_equivalent_layer_count) that counts
  actual nn.Linear submodules rather than trusting either framework's
  parameter name.
- dropout: 0.1 -> 0.0 (`enc_dropout_p`/`ffn_dropout_p` both default to 0.0).
- Bond features: the paper's own 12-dim Table 2 -> deepchem's real,
  never-patched 14-dim stock featurization -- structurally identical to
  chemprop's own built-in MultiHotBondFeaturizer() default, so that's used
  directly now instead of a custom PaperBondFeaturizer (removed).
- Readout: sum -> mean pooling. Not just an ignored kwarg landing back on a
  default that happens not to matter (like depth=3, which coincidentally
  matches the paper's own intent) -- `aggregation` isn't in MODEL_HPARAMS
  at all (grepped, absent), so this is the real model doing something the
  paper's own eqn 11 explicitly says it doesn't do.
- Atom features (35-dim, Table 1) are UNCHANGED -- this is the one part of
  the paper's claimed architecture that genuinely was realized (patched
  into deepchem's own GraphConvConstants.ATOM_FDIM, per [cosmonet_investigation]'s "WHY
  THE AUTHORS' OWN CHECKPOINT IS (300, 49)" note), so PaperAtomFeaturizer
  stays exactly as it was.
- Not replicated: the real run's optimizer/LR schedule
  (ExponentialDecay(initial_rate=0.001, decay_rate=0.95, decay_steps=1000),
  set directly in the script rather than via the broken MODEL_HPARAMS dict,
  so genuinely applied) vs chemprop's own default Adam + Noam-like warmup.
  Would need subclassing MPNN.configure_optimizers -- a documented,
