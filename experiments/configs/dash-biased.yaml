# DASH Stage A on the headline extrapolation split: DASH's own published tree
# topology (match_new_atom, unmodified) AND its own DASHTree.get_property_
# noNAN for prediction-time back-off, called directly rather than
# reimplemented -- see predictors/dash.py's DASHPredictor/
# populate_tree_with_sigma_properties/predict_via_data_storage_walk
# docstrings for exactly what that means.
#
# No shape/location decomposition, no minimum_support concept: DASH's own
# code has neither (Node.prune(), the one piece of code that would implement
# a count threshold, is dead -- confirmed never called from the real
# tree-building pipeline). Back-off here is purely DASHTree.get_property_
# noNAN's own missing-value fallback (deepest -> shallowest, first populated
# node wins, else the global mean), executing for real, not reimplemented.
# Sieve initially tried its own decomposed/raw variants with a
# minimum_support-gated threshold on top of the published topology; measured
# to underperform this simpler design on every metric -- see pins.toml's
# [dash_tree] notes for the full comparison.
#
# attention_threshold=5.2 is the paper's own tuned optimum (Fig 8/10), not
# DASH's own code default (10).
#
# charge_std_floor=0.1 matches DASHTree.get_molecules_partial_charges's own
# default_std_value -- not the 1e-12 every other predictor in this project
# uses (see predictors/base.py::reconcile_charge's docstring).
#
# Note (documented, not hidden): DASH-properties' own paper (Lehner et al.,
# J. Chem. Phys. 161, 074103 (2024)) says each node stores the "median" of
# matching atoms' values. The actual DASH-tree code computes np.nanmean,
# never np.median (confirmed: zero median calls anywhere in serenityff/) --
# a real paper/code discrepancy. This predictor follows the code, per
# "rely on their code as much as possible."
#
# Otherwise identical to dash-random.yaml -- the two files should stay
# diffable to exactly the split_column line.
run:
  experiment: milestone1-sigma-profile
  seed: 0
  tags:
    stage: A

data:
  store: chaos-store
  scheme: cosmo-sac-2010
  split_column: biased_split

predictor:
  name: dash
  params:
    # store/scheme duplicate data.* above -- DASHPredictor loads atom-level
    # truth itself (load_molecule_set never populates it; see data.py's
    # module docstring), so it needs its own store/scheme handle.
    store: chaos-store
    scheme: cosmo-sac-2010
    max_depth: 16
    attention_threshold: 5.2
    charge_reconciliation: std_weighted
    charge_std_floor: 0.1
