# DASH Stage A, "raw" profile mode: same published tree topology and
# back-off logic as dash-biased.yaml, but with the shape/location/area
# decomposition switched off (predictors/dash.py's profile_mode="raw") --
# each node's stat is the plain bin-wise mean of its members' raw,
# unnormalized profiles, and area/charge are only ever derived from that
# predicted profile (sum, profile @ sigma_values), never fit separately.
# Exists to measure what the decomposition (dash-biased.yaml) actually buys
# over the simpler alternative -- see fit_backoff_raw's docstring.
run:
  experiment: milestone1-sigma-profile
  seed: 0
  tags:
    stage: A

data:
  store: chaos-store
  scheme: cosmo-sac-2010
  split_column: biased_split

predictor:
  name: dash_backoff
  params:
    # store/scheme duplicate data.* above -- DASHBackoffPredictor loads
    # atom-level truth itself (load_molecule_set never populates it; see
    # data.py's module docstring), so it needs its own store/scheme handle.
    store: chaos-store
    scheme: cosmo-sac-2010
    max_depth: 16
    attention_threshold: 5.2
    minimum_support: 5
    charge_reconciliation: std_weighted
    profile_mode: raw
