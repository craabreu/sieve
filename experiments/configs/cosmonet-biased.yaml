# COSMO-NET on the headline extrapolation split. Otherwise identical to
# cosmonet-random.yaml.
run:
  experiment: milestone1-sigma-profile
  seed: 0
  tags:
    stage: A

data:
  store: chaos-store
  scheme: cosmo-sac-2010
  split_column: biased_split

predictor:
  name: cosmonet
  params:
    # store/scheme duplicate data.* above -- the runner's own
    # _check_predictor_store_scheme cross-check reads these. predictions_csv
    # is COSMO-NET's own saved inference output from an externally trained
    # checkpoint (see predictors/cosmonet.py's module docstring and
    # pins.toml's [cosmonet] notes) -- not something this predictor trains
    # itself. Its CATEGORY column must have been built from this run's own
    # split_column (biased_split here); predictors/cosmonet.py certifies
    # that at fit/predict time and raises if it doesn't match.
    store: chaos-store
    scheme: cosmo-sac-2010
    predictions_csv: experiments/external/COSMO-NET-Paper/Training/DMPNN/cosmonet-chaos-store-biased-predictions.csv
