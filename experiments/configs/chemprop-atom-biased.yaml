# T11: a per-ATOM D-MPNN sigma-profile predictor on Chemprop's
# MolAtomBondMPNN. Same training recipe as chemprop-biased.yaml (T10) -- raw
# unnormalized bins, min-max scaling fit on train only, softplus, MSE -- but
# predicting one profile per atom instead of one per molecule, so the
# molecule-level numbers come from the harness's own roll_up of those atom
# predictions. See predictors/chemprop_atom.py's module docstring for the two
# deliberate departures from T10 (chemprop's own 72-dim atom featurizer, and
# explicit hydrogens) and for the atom-ordering guarantees.
# Headline extrapolation split.
run:
  experiment: milestone1-sigma-profile
  seed: 0
  tags:
    stage: A

data:
  store: chaos-store
  scheme: cosmo-sac-2010
  split_column: biased_split

predictor:
  name: chemprop_atom
  params:
    # store/scheme duplicate data.* above -- this predictor loads atom-level
    # truth itself (load_molecule_set never populates it; see data.py's
    # module docstring), and the runner's own _check_predictor_store_scheme
    # cross-checks these against data.*.
    store: chaos-store
    scheme: cosmo-sac-2010
    hidden_size: 300
    depth: 3
    dropout: 0.0
    # ffn_n_layers=2 means 3 total Linear layers -- chemprop counts
    # *additional* hidden layers, deepchem counts the total. Same offset
    # documented in chemprop-biased.yaml.
    ffn_n_layers: 2
    batch_size: 64
    max_epochs: 100
    # "none" keeps the reported charge metrics the model's own raw output,
    # directly comparable to T10's. DASH uses std_weighted, which would need
    # an atom_charge_std this model does not predict.
    charge_reconciliation: none
    # NOT softplus (T10's, and the paper's). Atom profiles are 81.4% exact
    # zeros, which softplus can only reach as its pre-activation goes to
    # -inf -- exactly where its own gradient vanishes -- so a softplus head
    # collapses to identically-zero output and cannot even overfit 20
    # molecules. x**2 is equally structurally non-negative but reaches exact
    # zero at a finite input. See predictors/chemprop_atom.py's module
    # docstring for the measured comparison.
    output_activation: squared
