# DASH Stage A: published tree topology, our own per-node statistics fit on
# the training split. Sanity-reference split (random, cluster-aware) -- see
# dash-biased.yaml for the headline extrapolation split.
run:
  experiment: milestone1-sigma-profile
  seed: 0
  tags:
    stage: A

data:
  store: chaos-store
  scheme: cosmo-sac-2010
  split_column: split

predictor:
  name: dash_backoff
  params:
    max_depth: 16
    attention_threshold: 10
    minimum_support: 5
    charge_reconciliation: std_weighted
