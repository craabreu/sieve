# NOT A BENCHMARK CONFIG -- kept only to reproduce a diagnostic finding.
# DECISION (2026-08-25): DASH is AA-only (dash-biased.yaml/dash-random.yaml)
# for every comparison in this milestone. Do not add this run's numbers to
# any results table alongside dash-biased/chemprop_dmpnn/chemprop_atom.
#
# Why: DASH's own atom feature uses RDKit's GetDegree() (explicit-neighbor
# count only), and DASH's own paper (Lehner et al., J. Chem. Inf. Model. 63,
# 6014-6028 (2023), "Atom Features") defines "number of bonds" and "number
# of attached hydrogens" as independent fields with hydrogen itself typed
# as "H 1 0 False 0" -- i.e. DASH's design assumes every atom, hydrogen
# included, is an explicit graph node. That is DASH's INPUT CONTRACT, not
# an implementation detail. chaos-store-ua's implicit-H SMILES are outside
# that contract by construction: on the full store this config rejects
# 4.6% of test molecules outright (vs 1.0% for dash-biased.yaml) and scores
# markedly worse on every metric -- not because united-atom targets are
# harder, but because DASH's published tree/vocabulary was never built to
# see the degree values an implicit-H representation produces. See
# pins.toml's `[chaos_store_ua]` CORRECTION note for the full mechanistic
# trace and the full-store numbers.
run:
  experiment: milestone1-sigma-profile
  seed: 0
  tags:
    stage: A

data:
  store: chaos-store-ua
  scheme: cosmo-sac-2010
  split_column: biased_split

predictor:
  name: dash_backoff
  params:
    # store/scheme duplicate data.* above -- DASHBackoffPredictor loads
    # atom-level truth itself (load_molecule_set never populates it; see
    # data.py's module docstring), so it needs its own store/scheme handle.
    store: chaos-store-ua
    scheme: cosmo-sac-2010
    max_depth: 16
    attention_threshold: 5.2
    minimum_support: 5
    charge_reconciliation: std_weighted
