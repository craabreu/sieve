# T10: a from-scratch D-MPNN sigma-profile predictor on Chemprop. Sanity-
# reference split (random, cluster-aware) -- see chemprop-biased.yaml for the
# headline extrapolation split, and predictors/chemprop_dmpnn.py's module
# docstring for what this predictor is and why it exists.
run:
  experiment: milestone1-sigma-profile
  seed: 0
  tags:
    stage: A

data:
  store: chaos-store
  scheme: cosmo-sac-2010
  split_column: split

predictor:
  name: chemprop_dmpnn
  params:
    store: chaos-store
    scheme: cosmo-sac-2010
    hidden_size: 51
    depth: 3
    dropout: 0.1
    batch_size: 64
    max_epochs: 100
